name: CI

on:
  push:
    branches: [main, develop]
  # No branches filter: stacked PRs (feature branch -> feature branch) must
  # run CI too, not just PRs targeting main.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test
